name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # The CPU wheel of torch is a fraction of the size of the default CUDA build,
      # and the service never uses a GPU.
      - name: Install dependencies
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      # Tokenizer and embedding model; ~90 MB, fetched once and reused across runs.
      - name: Cache HuggingFace models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      # No GROQ_API_KEY: every test that reaches generation replaces the LLM call.
      - name: Run test suite
        run: pytest -v
